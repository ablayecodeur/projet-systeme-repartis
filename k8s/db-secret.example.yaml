# Template only — do NOT apply this file as-is or commit real credentials.
#
# Create the real secret imperatively instead:
#   kubectl create secret generic db-credentials \
#     --from-literal=POSTGRES_DB=microdb \
#     --from-literal=POSTGRES_USER=microuser \
#     --from-literal=POSTGRES_PASSWORD='<a-real-password>'
#
# postgres-deployment.yaml and backend-deployment.yaml read from this
# secret via secretKeyRef instead of hardcoding the password in git.
apiVersion: v1
kind: Secret
metadata:
  name: db-credentials
type: Opaque
stringData:
  POSTGRES_DB: microdb
  POSTGRES_USER: microuser
  POSTGRES_PASSWORD: change-me
