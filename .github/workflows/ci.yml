name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  backend-tests:
    name: Backend — tests Django
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_DB: microdb
          POSTGRES_USER: microuser
          POSTGRES_PASSWORD: ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U microuser"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: backend
        env:
          DB_NAME: microdb
          DB_USER: microuser
          DB_PASSWORD: ci-password
          DB_HOST: localhost
          DB_PORT: 5432
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: 'True'
        run: python manage.py test api

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t backend:ci ./backend

      - name: Build frontend image
        run: docker build -t frontend:ci ./frontend
